# Every push to main rebuilds the `live` branch, and Hostinger deploys `live` into public_html by itself
# (hPanel's GitHub connection, set to the `live` branch).
#
# `live` is shaped exactly like the server's public_html:
#   public_html/*  ->  the top of `live`
#   bondi/         ->  bondi/   (locked on the server by bondi/.htaccess)
# sql/, dev/, video/ and the notes never reach the server. config.php is never in git, so a deploy never
# replaces it: it stays the one file edited by hand in File Manager.

name: Publish the live branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every PHP file for syntax errors
        run: find public_html bondi -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build what the server gets
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE/bondi"
          cp -a public_html/. "$SITE/"
          cp -a bondi/. "$SITE/bondi/"
          rm -f "$SITE/bondi/config.php" "$SITE/bondi/mail.log"
          find "$SITE" \( -name '.DS_Store' -o -name '_*.html' \) -delete

      - name: Commit it to the live branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          # Build on top of the previous live commit, so Hostinger only ever fast-forwards.
          if git fetch -q --depth=1 origin live; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          if git rev-parse -q --verify HEAD > /dev/null && git diff --cached --quiet HEAD; then
            echo "Nothing changed for the server."; exit 0
          fi
          git commit -q -m "Publish ${GITHUB_SHA::7}: $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          git push -q origin live
          git log --stat -1 | head -40
